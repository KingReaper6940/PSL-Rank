<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <title>PSL Rank - 404</title>
  <style>
    :root {
      --bg: #050505;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.09);
      --text: #fff;
      --muted: #a1a1aa;
      --accent: #0ea5a4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 12% 8%, rgba(14,165,164,0.12), transparent 45%),
        radial-gradient(circle at 86% 20%, rgba(255,255,255,0.04), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }
    .shell {
      width: min(980px, 100%);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
      border-radius: 24px;
      padding: 24px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      box-shadow: 0 30px 80px -40px rgba(0,0,0,0.8);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(14,165,164,0.1);
      border: 1px solid rgba(14,165,164,0.22);
      color: #7ce1df;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 700;
    }
    h1 {
      margin: 14px 0 10px;
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: .95;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 55ch;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
    }
    .btn.primary {
      background: rgba(14,165,164,0.13);
      border-color: rgba(14,165,164,0.25);
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
      padding: 16px;
      align-self: start;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
    }
    .panel ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }
    .panel a { color: #d4d4d8; }
    .panel a:hover { color: #fff; }
    @media (max-width: 768px) {
      .shell { grid-template-columns: 1fr; padding: 18px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell" aria-labelledby="nf-title">
    <section>
      <div class="badge">404 / Route Miss</div>
      <h1 id="nf-title">Page not found</h1>
      <p>
        The page you requested is unavailable. Continue browsing the vote arena,
        leaderboard, or help pages.
      </p>
      <div class="actions">
        <a class="btn primary" href="/">Back to Vote Arena</a>
        <a class="btn" href="/leaderboard">Leaderboard</a>
        <a class="btn" href="/faq">FAQ</a>
      </div>
    </section>
    <aside class="panel" aria-label="Helpful links">
      <h2>Popular destinations</h2>
      <ul>
        <li><a href="/how-it-works">How It Works</a></li>
        <li><a href="/stats">Statistics</a></li>
        <li><a href="/submit">Submit a Contender</a></li>
      </ul>
    </aside>
  </main>
</body>
</html>
